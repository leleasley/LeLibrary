name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Fail fast, before anything is built: the tag, package.json,
  # frontend/package.json and the newest CHANGELOG section must all agree, and
  # the section must follow the house rules.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/release/notes.test.mjs
      - run: node .github/release/notes.mjs check "$GITHUB_REF_NAME"

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # Frontend first: the backend tests also check the built error page.
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/leleasley/lelibrary
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish GHCR image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

      - name: Attest GHCR image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/leleasley/lelibrary
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Only this version's section (no header), plus the docker pull line, the
      # image digest and a compare link to the previous tag.
      - name: Build release notes
        run: node .github/release/notes.mjs notes "$GITHUB_REF_NAME" --digest "${{ needs.image.outputs.digest }}" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: LeLibrary ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  # A release created with GITHUB_TOKEN never fires the `release` event, so the
  # Discord announcement is called directly once the release exists.
  discord:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/discord-notifications.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
