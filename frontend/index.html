    <style>
      /* Boot skeleton: visible only until React mounts into #root. */
      .boot { max-width: 1180px; margin: 0 auto; padding: 22px clamp(18px, 4vw, 40px); display: grid; gap: 14px; }
      #root:not(:empty) + .boot { display: none; }
      .boot i { display: block; height: 12px; border-radius: 8px; background: linear-gradient(100deg, rgba(255,255,255,.045) 30%, rgba(255,255,255,.095) 50%, rgba(255,255,255,.045) 70%) 0 0 / 300% 100%; animation: boot 1.6s ease-in-out infinite; }
      .boot .n { height: 34px; margin-bottom: 30px; border-radius: 12px; }
      .boot .e { width: 110px; height: 10px; background: rgba(245,158,11,.22); animation: none; }
      .boot .t { height: 38px; width: 52%; } .boot .t2 { height: 38px; width: 34%; margin-bottom: 8px; }
      .boot .l { width: 56%; } .boot .l2 { width: 42%; }
      .boot .c { height: 180px; margin-top: 20px; border-radius: 16px; }
      @keyframes boot { from { background-position: 100% 0; } to { background-position: 0 0; } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot" aria-hidden="true"><i class="n"></i><i class="e"></i><i class="t"></i><i class="t2"></i><i class="l"></i><i class="l2"></i><i class="c"></i></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
